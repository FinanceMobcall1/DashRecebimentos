<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <!-- 1. Primeiro a biblioteca precisa carregar aqui -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>
</head>
<body>
  <div id="status">Carregando...</div>

  <script>
    // 2. Agora o seu script pode rodar, pois a constante "Papa" já existe
    const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pub?gid=0&single=true&output=csv";

    function carregarDados() {
        if (typeof Papa === 'undefined') {
            console.error("PapaParse não foi carregado!");
            return;
        }
        Papa.parse(URL_CSV, {
            download: true,
            header: true,
            complete: function(results) {
                console.log("Dados ok:", results.data);
                document.getElementById("status").textContent = "Carregado!";
            }
        });
    }
    carregarDados();
  </script>
</body>
</html>
