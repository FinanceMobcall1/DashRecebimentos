<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <!-- Usando um link alternativo e garantindo o carregamento -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div id="status">Iniciando...</div>

    <script>
        const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pub?gid=0&single=true&output=csv";

        function verificarECarregar() {
            if (typeof Papa !== 'undefined') {
                document.getElementById("status").textContent = "Biblioteca carregada. Lendo dados...";
                Papa.parse(URL_CSV, {
                    download: true,
                    header: true,
                    complete: function(results) {
                        document.getElementById("status").textContent = "Sucesso! " + results.data.length + " linhas carregadas.";
                        console.log(results.data);
                    },
                    error: function(err) {
                        document.getElementById("status").textContent = "Erro no CSV: " + err.message;
                    }
                });
            } else {
                document.getElementById("status").textContent = "Aguardando biblioteca...";
                setTimeout(verificarECarregar, 500); // Tenta de novo a cada meio segundo
            }
        }

        verificarECarregar();
    </script>
</body>
</html>
