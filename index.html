<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recebimentos Mobcall</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --primary: #38bdf8; --green: #22c55e; --red: #f43f5e; --border: #334155; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px; margin: 0; }
    .header { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 40px; }
    .logo-container { position: absolute; left: 0; }
    .logo-container img { max-width: 220px; height: auto; }
    h1 { font-size: 1.8rem; color: white; margin: 0; }
    .filters { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border); display: flex; justify-content: center; margin-bottom: 30px; }

    .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 40px; max-width: 800px; margin-left: auto; margin-right: auto; }
    .card { background: var(--card-bg); padding: 24px; border-radius: 20px; border: 1px solid var(--border); }
    .card-title { color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; }
    .card-valor { font-size: 1.8rem; font-weight: 700; margin-top: 8px; }

    .secoes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .secao { background: var(--card-bg); padding: 24px; border-radius: 20px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 0.75rem; color: var(--text-muted); padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-container"><img src="LINK_DA_SUA_LOGO" alt="Logo"></div>
    <h1>Recebimentos Mobcall</h1>
  </div>

  <div class="filters">
    <label>Selecione a data para filtrar:</label>
    <input type="date" id="filtroData" onchange="processarDados()">
  </div>

  <div class="kpis">
    <div class="card"><div class="card-title">Recebimentos do dia</div><div class="card-valor" id="kpiDia" style="color: var(--green);">R$ 0,00</div></div>
    <div class="card"><div class="card-title">Total Atrasado</div><div class="card-valor" id="kpiAtrasado" style="color: var(--red);">R$ 0,00</div></div>
  </div>

  <div class="secoes">
    <div class="secao"><h2>Recebimentos Filtrados</h2><table id="tabRecebimentos"><thead><tr><th>Cliente</th><th>Data</th><th>Valor</th></tr></thead><tbody></tbody></table></div>
    <div class="secao"><h2>Clientes em Atraso</h2><table id="tabAtrasos"><thead><tr><th>Cliente</th><th>Vencim.</th><th>Status</th><th>Obs.</th><th>Valor</th></tr></thead><tbody></tbody></table></div>
  </div>

  <script>
    const URL_REC = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pubhtml?gid=0&single=true";
    const URL_ATR = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pubhtml?gid=420641834&single=true";
    let dadosRec = [], dadosAtr = [];
    let primeiraExecucao = true;

    const formatarMoeda = (v) => "R$ " + (parseFloat(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });

    function carregar() {
      Papa.parse(URL_REC, { download: true, header: true, complete: res => { dadosRec = res.data; verificarCarregamento(); } });
      Papa.parse(URL_ATR, { download: true, header: true, complete: res => { dadosAtr = res.data; verificarCarregamento(); } });
    }

    function verificarCarregamento() {
      if(dadosRec.length > 0 && dadosAtr.length > 0) {
        if(primeiraExecucao) definirDataMaxima();
        processarDados();
      }
    }

    function definirDataMaxima() {
      let datas = dadosRec.map(l => {
        let p = l["Data de recebimento"]?.split('/');
        return p ? new Date(p[2], p[1]-1, p[0]) : null;
      }).filter(d => d);

      let dataMaisRecente = new Date(Math.max.apply(null, datas));
      document.getElementById('filtroData').value = dataMaisRecente.toISOString().split('T')[0];
      primeiraExecucao = false;
    }

    function processarDados() {
      const fData = document.getElementById('filtroData').value;
      const tRec = document.querySelector("#tabRecebimentos tbody");
      const tAtr = document.querySelector("#tabAtrasos tbody");
      tRec.innerHTML = ""; tAtr.innerHTML = "";
      let k = { dia: 0, atraso: 0 };

      dadosRec.forEach(l => {
        let vR = parseFloat(l[" Valor recebido "]?.replace(/\./g, "").replace(",", ".") || 0);
        let dataP = l["Data de recebimento"]?.split('/');
        let dataPagFormat = dataP ? `${dataP[2]}-${dataP[1]}-${dataP[0]}` : "";
        if(dataPagFormat === fData) {
          k.dia += vR;
          tRec.innerHTML += `<tr><td>${l["Cliente"]}</td><td>${l["Data de recebimento"]}</td><td>${formatarMoeda(vR)}</td></tr>`;
        }
      });

      dadosAtr.forEach(l => {
        let vA = parseFloat(l["Valor original"]?.replace(/\./g, "").replace(",", ".") || 0);
        k.atraso += vA;
        tAtr.innerHTML += `<tr><td>${l["Cliente"]}</td><td>${l["Data de vencimento"]}</td><td>${l["Status"]}</td><td>${l["Observação"] || "-"}</td><td>${formatarMoeda(vA)}</td></tr>`;
      });
      document.getElementById("kpiDia").textContent = formatarMoeda(k.dia);
      document.getElementById("kpiAtrasado").textContent = formatarMoeda(k.atraso);
    }
    carregar();
  </script>
</body>
</html>
