<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recebimentos Mobcall</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root { --azul: #2563eb; --vermelho: #dc2626; --cinza: #f8fafc; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--cinza); padding: 20px; }
    h1 { text-align: center; color: var(--azul); }
    .filters { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; }
    .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 20px; }
    .card { background: white; padding: 15px; border-radius: 12px; border-top: 4px solid var(--azul); }
    .card-valor { font-size: 1.1rem; font-weight: 700; color: var(--azul); }
    .secoes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .secao { background: white; padding: 20px; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th { background: #f1f5f9; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
  </style>
</head>
<body>

  <h1>Recebimentos Mobcall</h1>

  <div class="filters">
    <input type="text" id="filtroCliente" placeholder="Buscar cliente..." onkeyup="aplicar()">
    <input type="date" id="filtroData" onchange="aplicar()" title="Data de recebimento">
  </div>

  <div class="kpis">
    <div class="card">Receb. no Dia<div class="card-valor" id="kpiDia">R$ 0,00</div></div>
    <div class="card">Total a Receber<div class="card-valor" id="kpiTotal">R$ 0,00</div></div>
    <div class="card">Total Recebido<div class="card-valor" id="kpiRecebido">R$ 0,00</div></div>
    <div class="card">Total em Aberto<div class="card-valor" id="kpiAberto">R$ 0,00</div></div>
    <div class="card">Total Atrasado<div class="card-valor" id="kpiAtrasado">R$ 0,00</div></div>
  </div>

  <div class="secoes">
    <div class="secao"><h2>Recebimentos Filtrados</h2><table id="tabRecebimentos"><thead><tr><th>Cliente</th><th>Data</th><th>Valor</th></tr></thead><tbody></tbody></table></div>
    <div class="secao"><h2>Clientes em Atraso</h2><table id="tabAtraso"><thead><tr><th>Cliente</th><th>Vencimento</th><th>Valor em Atraso</th></tr></thead><tbody></tbody></table></div>
  </div>

  <script>
    const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pub?gid=0&single=true&output=csv";
    let gd = [];

    function carregar() { Papa.parse(URL, { download: true, header: true, complete: res => { gd = res.data; aplicar(); } }); }

    function aplicar() {
        const termo = document.getElementById('filtroCliente').value.toLowerCase();
        const fData = document.getElementById('filtroData').value;
        const tbodyRec = document.querySelector("#tabRecebimentos tbody");
        const tbodyAtr = document.querySelector("#tabAtraso tbody");
        tbodyRec.innerHTML = ""; tbodyAtr.innerHTML = "";

        let k = { dia: 0, tot: 0, rec: 0, abe: 0, atr: 0 };
        const hoje = new Date(); hoje.setHours(0,0,0,0);

        gd.forEach(l => {
            let vO = parseFloat(l["Valor original da parcela (R$)"]?.replace(/\./g, "").replace(",", ".") || 0);
            let vR = parseFloat(l["Valor total recebido da parcela (R$)"]?.replace(/\./g, "").replace(",", ".") || 0);
            let vA = vO - vR;
            let dP = l["Data do último pagamento"]?.split('/');
            let dataPag = dP ? `${dP[2]}-${dP[1]}-${dP[0]}` : "";
            let vDate = new Date(l["Data de vencimento"]);

            k.tot += vO; k.rec += vR; k.abe += vA;
            if (vDate < hoje && vA > 0) k.atr += vA;

            if (l["Nome do cliente"]?.toLowerCase().includes(termo)) {
                if (dataPag === fData && vR > 0) {
                    k.dia += vR;
                    tbodyRec.innerHTML += `<tr><td>${l["Nome do cliente"]}</td><td>${l["Data do último pagamento"]}</td><td>R$ ${vR.toFixed(2).replace('.',',')}</td></tr>`;
                }
                if (vDate < hoje && vA > 0) {
                    tbodyAtr.innerHTML += `<tr><td>${l["Nome do cliente"]}</td><td>${l["Data de vencimento"]}</td><td>R$ ${vA.toFixed(2).replace('.',',')}</td></tr>`;
                }
            }
        });

        document.getElementById("kpiDia").textContent = "R$ " + k.dia.toFixed(2).replace('.',',');
        document.getElementById("kpiTotal").textContent = "R$ " + k.tot.toFixed(2).replace('.',',');
        document.getElementById("kpiRecebido").textContent = "R$ " + k.rec.toFixed(2).replace('.',',');
        document.getElementById("kpiAberto").textContent = "R$ " + k.abe.toFixed(2).replace('.',',');
        document.getElementById("kpiAtrasado").textContent = "R$ " + k.atr.toFixed(2).replace('.',',');
    }
    carregar();
  </script>
</body>
</html>
