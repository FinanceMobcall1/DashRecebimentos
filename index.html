<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recebimentos Mobcall</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --green: #22c55e;
      --red: #f43f5e;
      --border: #334155;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px; margin: 0; }

    .header { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 40px; }
    .logo-container { position: absolute; left: 0; }
    .logo-container img { max-width: 140px; border-radius: 8px; }
    h1 { font-size: 1.8rem; font-weight: 700; color: white; margin: 0; }

    .filters { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border); display: flex; justify-content: center; margin-bottom: 30px; }
    label { font-weight: 400; color: var(--text-muted); margin-right: 15px; align-self: center; }
    input { padding: 10px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: white; font-family: inherit; }

    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; }
    .card { background: var(--card-bg); padding: 24px; border-radius: 20px; border: 1px solid var(--border); transition: 0.3s; }
    .card:hover { border-color: var(--primary); }
    .card-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-valor { font-size: 1.8rem; font-weight: 700; }

    .secoes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .secao { background: var(--card-bg); padding: 24px; border-radius: 20px; border: 1px solid var(--border); }
    h2 { font-size: 1rem; color: var(--text-muted); margin-top: 0; margin-bottom: 20px; text-transform: uppercase; }

    table { width: 100%; border-collapse: collapse; }
    th { font-size: 0.75rem; color: var(--text-muted); padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 14px 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    tr:hover { background: rgba(255,255,255,0.03); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-container"><img src="https://github.com/FinanceMobcall1/Dashboard/blob/main/Mobacall_logos%202026-01.png?raw=true" alt="Logo"></div>
    <h1>Recebimentos Mobcall</h1>
  </div>

  <div class="filters">
    <label>Selecione a data para filtrar:</label>
    <input type="date" id="filtroData" onchange="aplicar()">
  </div>

  <div class="kpis">
    <div class="card"><div class="card-title">Recebimentos do dia</div><div class="card-valor" id="kpiDia" style="color: var(--green);">R$ 0,00</div></div>
    <div class="card"><div class="card-title">Total a receber</div><div class="card-valor" id="kpiAberto" style="color: var(--primary);">R$ 0,00</div></div>
    <div class="card"><div class="card-title">Total atrasado</div><div class="card-valor" id="kpiAtrasado" style="color: var(--red);">R$ 0,00</div></div>
  </div>

  <div class="secoes">
    <div class="secao"><h2>Recebimentos Filtrados</h2><table id="tabRecebimentos"><thead><tr><th>Cliente</th><th>Data</th><th>Valor</th></tr></thead><tbody></tbody></table></div>
    <div class="secao"><h2>Clientes em Atraso</h2><table id="tabAtraso"><thead><tr><th>Cliente</th><th>Vencimento</th><th>Valor em Atraso</th></tr></thead><tbody></tbody></table></div>
  </div>

  <script>
    const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pub?gid=0&single=true&output=csv";
    let gd = [];
    const formatarMoeda = (valor) => "R$ " + valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    function carregar() { Papa.parse(URL, { download: true, header: true, complete: res => { gd = res.data; aplicar(); } }); }

    function aplicar() {
        const fData = document.getElementById('filtroData').value;
        const tbodyRec = document.querySelector("#tabRecebimentos tbody");
        const tbodyAtr = document.querySelector("#tabAtraso tbody");
        tbodyRec.innerHTML = ""; tbodyAtr.innerHTML = "";
        let k = { dia: 0, abe: 0, atr: 0 };
        const hoje = new Date(); hoje.setHours(0,0,0,0);

        gd.forEach(l => {
            let vO = parseFloat(l["Valor original da parcela (R$)"]?.replace(/\./g, "").replace(",", ".") || 0);
            let vR = parseFloat(l["Valor total recebido da parcela (R$)"]?.replace(/\./g, "").replace(",", ".") || 0);
            let vA = vO - vR;
            let pV = l["Data de vencimento"]?.split('/');
            let vDate = pV ? new Date(pV[2], pV[1]-1, pV[0]) : null;
            let pP = l["Data do último pagamento"]?.split('/');
            let dataPag = pP ? `${pP[2]}-${pP[1]}-${pP[0]}` : "";

            if (vA > 0) k.abe += vA;
            if (vDate && vDate < hoje && vA > 0.01) k.atr += vA;

            if (dataPag === fData && vR > 0) {
                k.dia += vR;
                tbodyRec.innerHTML += `<tr><td>${l["Nome do cliente"]}</td><td>${l["Data do último pagamento"]}</td><td style="font-weight:600">${formatarMoeda(vR)}</td></tr>`;
            }
            if (vDate && vDate < hoje && vA > 0.01) {
                tbodyAtr.innerHTML += `<tr><td>${l["Nome do cliente"]}</td><td>${l["Data de vencimento"]}</td><td style="color:var(--red); font-weight:600">${formatarMoeda(vA)}</td></tr>`;
            }
        });
        document.getElementById("kpiDia").textContent = formatarMoeda(k.dia);
        document.getElementById("kpiAberto").textContent = formatarMoeda(k.abe);
        document.getElementById("kpiAtrasado").textContent = formatarMoeda(k.atr);
    }
    carregar();
  </script>
</body>
</html>
