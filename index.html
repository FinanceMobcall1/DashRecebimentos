<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recebimentos Mobcall</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root { --azul: #2563eb; --vermelho: #dc2626; --verde: #059669; --cinza: #f8fafc; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--cinza); padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header img { max-width: 150px; margin-bottom: 10px; }
    .filters { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: center; box-shadow: 0 2px 4px #00000005; }
    .filter-group { display: flex; align-items: center; gap: 10px; }
    label { font-size: 0.95rem; color: #475569; font-weight: 600; }
    input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 4px #00000005; border-top: 4px solid var(--azul); }
    .card-valor { font-size: 1.4rem; font-weight: 700; margin-top: 5px; }
    .verde { color: var(--verde); border-color: var(--verde) !important; }
    .azul { color: var(--azul); border-color: var(--azul) !important; }
    .vermelho { color: var(--vermelho); border-color: var(--vermelho) !important; }
    .secoes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .secao { background: white; padding: 20px; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th { background: #f1f5f9; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://github.com/FinanceMobcall1/Dashboard/blob/main/Mobacall_logos%202026-01.png?raw=true" alt="Logo Mobcall">
    <h1>Recebimentos Mobcall</h1>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label for="filtroData">Selecione a data para visualizar recebimentos:</label>
      <input type="date" id="filtroData" onchange="aplicar()">
    </div>
  </div>

  <div class="kpis">
    <div class="card verde">Recebimentos do dia<div class="card-valor" id="kpiDia">R$ 0,00</div></div>
    <div class="card azul">Total a receber<div class="card-valor" id="kpiAberto">R$ 0,00</div></div>
    <div class="card vermelho">Total atrasado<div class="card-valor" id="kpiAtrasado">R$ 0,00</div></div>
  </div>

  <div class="secoes">
    <div class="secao"><h2>Recebimentos Filtrados</h2><table id="tabRecebimentos"><thead><tr><th>Cliente</th><th>Data</th><th>Valor</th></tr></thead><tbody></tbody></table></div>
    <div class="secao"><h2>Clientes em Atraso</h2><table id="tabAtraso"><thead><tr><th>Cliente</th><th>Vencimento</th><th>Valor em Atraso</th></tr></thead><tbody></tbody></table></div>
  </div>

  <script>
    const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pub?gid=0&single=true&output=csv";
    let gd = [];

    const formatarMoeda = (valor) => "R$ " + valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function carregar() { Papa.parse(URL, { download: true, header: true, complete: res => { gd = res.data; aplicar(); } }); }

    function aplicar() {
        const fData = document.getElementById('filtroData').value;
        const tbodyRec = document.querySelector("#tabRecebimentos tbody");
        const tbodyAtr = document.querySelector("#tabAtraso tbody");
        tbodyRec.innerHTML = ""; tbodyAtr.innerHTML = "";

        let k = { dia: 0, abe: 0, atr: 0 };
        const hoje = new Date(); hoje.setHours(0,0,0,0);

        gd.forEach(l => {
            let vO = parseFloat(l["Valor original da parcela (R$)"]?.replace(/\./g, "").replace(",", ".") || 0);
            let vR = parseFloat(l["Valor total recebido da parcela (R$)"]?.replace(/\./g, "").replace(",", ".") || 0);
            let vA = vO - vR;
            let pV = l["Data de vencimento"]?.split('/');
            let vDate = pV ? new Date(pV[2], pV[1]-1, pV[0]) : null;
            let pP = l["Data do último pagamento"]?.split('/');
            let dataPag = pP ? `${pP[2]}-${pP[1]}-${pP[0]}` : "";

            if (vA > 0) k.abe += vA;
            if (vDate && vDate < hoje && vA > 0.01) k.atr += vA;

            if (dataPag === fData && vR > 0) {
                k.dia += vR;
                tbodyRec.innerHTML += `<tr><td>${l["Nome do cliente"]}</td><td>${l["Data do último pagamento"]}</td><td>${formatarMoeda(vR)}</td></tr>`;
            }
            if (vDate && vDate < hoje && vA > 0.01) {
                tbodyAtr.innerHTML += `<tr><td>${l["Nome do cliente"]}</td><td>${l["Data de vencimento"]}</td><td>${formatarMoeda(vA)}</td></tr>`;
            }
        });

        document.getElementById("kpiDia").textContent = formatarMoeda(k.dia);
        document.getElementById("kpiAberto").textContent = formatarMoeda(k.abe);
        document.getElementById("kpiAtrasado").textContent = formatarMoeda(k.atr);
    }
    carregar();
  </script>
</body>
</html>
