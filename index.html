<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recebimentos Mobcall</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --primary: #38bdf8; --green: #22c55e; --red: #f43f5e; --border: #334155; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px; }
    .secoes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .secao { background: var(--card-bg); padding: 24px; border-radius: 20px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 0.75rem; color: var(--text-muted); padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <input type="date" id="filtroData" onchange="processarDados()">
  <div class="secoes">
    <div class="secao"><h2>Recebimentos</h2><table id="tabRec"><thead><tr><th>Cliente</th><th>OS</th><th>Data</th><th>Valor</th></tr></thead><tbody></tbody></table></div>
    <div class="secao"><h2>Atrasados</h2><table id="tabAtr"><thead><tr><th>Cliente</th><th>Vencim.</th><th>Status</th><th>Obs.</th><th>Valor</th></tr></thead><tbody></tbody></table></div>
  </div>

  <script>
    const URL_REC = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pubhtml?gid=0&single=true";
    const URL_ATR = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pubhtml?gid=420641834&single=true";
    let dadosRec = [], dadosAtr = [];

    // Carrega ignorando o cabeçalho automaticamente
    function carregar() {
      Papa.parse(URL_REC, { download: true, header: true, skipEmptyLines: true, complete: r => { dadosRec = r.data; carregarAtr(); } });
    }
    function carregarAtr() {
      Papa.parse(URL_ATR, { download: true, header: true, skipEmptyLines: true, complete: r => { dadosAtr = r.data; iniciar(); } });
    }

    function iniciar() {
      if(!document.getElementById('filtroData').value) {
        let ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
        document.getElementById('filtroData').value = ontem.toISOString().split('T')[0];
      }
      processarDados();
    }

    function processarDados() {
      const fData = document.getElementById('filtroData').value;
      const tRec = document.querySelector("#tabRec tbody");
      const tAtr = document.querySelector("#tabAtr tbody");
      tRec.innerHTML = ""; tAtr.innerHTML = "";

      // Filtra Recebimentos (Atenção: verifique se estes nomes coincidem com os títulos na linha 1 da sua planilha)
      dadosRec.forEach(l => {
        let d = l["Data de recebimento"]?.split('/'); // Espera dd/mm/aaaa
        let dataFormatada = d ? `${d[2]}-${d[1]}-${d[0]}` : "";
        if(dataFormatada === fData) {
          tRec.innerHTML += `<tr><td>${l["Cliente"]}</td><td>${l["OS"]}</td><td>${l["Data de recebimento"]}</td><td>${l["Valor recebido"]}</td></tr>`;
        }
      });

      // Filtra Atrasados
      dadosAtr.forEach(l => {
        tAtr.innerHTML += `<tr><td>${l["Cliente"]}</td><td>${l["Data de vencimento"]}</td><td>${l["Status"]}</td><td>${l["Observações"]}</td><td>${l["Valor original"]}</td></tr>`;
      });
    }
    carregar();
  </script>
</body>
</html>
