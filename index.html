<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recebimentos Mobcall</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root { --azul-claro: #eff6ff; --azul: #2563eb; --cinza: #f8fafc; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--cinza); padding: 20px; color: #1e293b; }
    h1 { text-align: center; color: var(--azul); margin-bottom: 20px; }
    .filters { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; box-shadow: 0 2px 4px #00000005; }
    input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; flex: 1; }
    .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 20px; }
    .card { background: white; padding: 15px; border-radius: 12px; border-top: 4px solid var(--azul); box-shadow: 0 2px 4px #00000005; }
    .card-valor { font-size: 1.1rem; font-weight: 700; color: var(--azul); margin-top: 5px; }
    .secao { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 4px #00000005; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #f1f5f9; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
  </style>
</head>
<body>

  <h1>Recebimentos Mobcall</h1>

  <div class="filters">
    <input type="text" id="filtroCliente" placeholder="Buscar por cliente..." onkeyup="aplicarFiltros()">
    <input type="date" id="filtroData" onchange="aplicarFiltros()" title="Filtrar por data de recebimento">
  </div>

  <div class="kpis">
    <div class="card">Receb. Período<div class="card-valor" id="kpiRecebimentos">R$ 0,00</div></div>
    <div class="card">A Receber<div class="card-valor" id="kpiTotalReceber">R$ 0,00</div></div>
    <div class="card">Total Recebido<div class="card-valor" id="kpiTotalRecebido">R$ 0,00</div></div>
    <div class="card">Total Aberto<div class="card-valor" id="kpiTotalAberto">R$ 0,00</div></div>
    <div class="card">Total Atrasado<div class="card-valor" id="kpiTotalAtrasado">R$ 0,00</div></div>
  </div>

  <div class="secao">
    <h2>Parcelas Filtradas</h2>
    <table id="tabelaDados"><thead><tr><th>Cliente</th><th>Data Pagamento</th><th>Valor</th></tr></thead><tbody></tbody></table>
  </div>

  <script>
    const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdtP7kBeoxSO6aSd1dFY9obnPFs95A6KFQ7cYehOc1f7kNNJ4PZuRxbQom288CshAbSJTO8jeY9esT/pub?gid=0&single=true&output=csv";
    let dadosGlobais = [];

    function carregarDados() {
        Papa.parse(URL_CSV, { download: true, header: true, complete: res => { dadosGlobais = res.data; aplicarFiltros(); } });
    }

    function aplicarFiltros() {
        const termo = document.getElementById('filtroCliente').value.toLowerCase();
        const dataFiltro = document.getElementById('filtroData').value; // Formato yyyy-mm-dd

        const filtrados = dadosGlobais.filter(l => {
            const nomeMatch = l["Nome do cliente"]?.toLowerCase().includes(termo);
            // Simples conversão dd/mm/aaaa para yyyy-mm-dd para comparar
            const d = l["Data do último pagamento"]?.split('/');
            const dataPag = d ? `${d[2]}-${d[1]}-${d[0]}` : "";
            const dataMatch = !dataFiltro || dataPag === dataFiltro;
            return nomeMatch && dataMatch;
        });
        processar(filtrados);
    }

    function processar(dados) {
        let kpis = { periodo: 0, aReceber: 0, recebido: 0, aberto: 0, atrasado: 0 };
        let tbody = document.querySelector("#tabelaDados tbody"); tbody.innerHTML = "";

        dados.forEach(l => {
            let valOrig = parseFloat(l["Valor original da parcela (R$)"]?.replace(/\./g, "").replace(",", ".") || 0);
            let valRec = parseFloat(l["Valor total recebido da parcela (R$)"]?.replace(/\./g, "").replace(",", ".") || 0);
            kpis.aReceber += valOrig; kpis.recebido += valRec; kpis.aberto += (valOrig - valRec);

            if (valRec > 0) {
                kpis.periodo += valRec;
                tbody.innerHTML += `<tr><td>${l["Nome do cliente"]}</td><td>${l["Data do último pagamento"]}</td><td>R$ ${valRec.toFixed(2).replace('.',',')}</td></tr>`;
            }
        });

        document.getElementById("kpiRecebimentos").textContent = "R$ " + kpis.periodo.toFixed(2).replace('.',',');
        document.getElementById("kpiTotalReceber").textContent = "R$ " + kpis.aReceber.toFixed(2).replace('.',',');
        document.getElementById("kpiTotalRecebido").textContent = "R$ " + kpis.recebido.toFixed(2).replace('.',',');
        document.getElementById("kpiTotalAberto").textContent = "R$ " + kpis.aberto.toFixed(2).replace('.',',');
    }
    carregarDados();
  </script>
</body>
</html>
